# Enrôlement, enregistrement au micro, upload et suivi du pipeline.
# Demande un micro fonctionnel dans le simulateur : joué en local, exclu de
# la CI (tag microphone).
appId: fr.gouv.mirai.audio-secure
name: Enrôlement, enregistrement et upload
tags:
  - microphone
env:
  SIMPLE_CODE: E2E123
---
- runScript:
    file: scripts/set-scenario.js
    env:
      SCENARIO: '{}'
- runFlow: subflows/enroll-by-code.yaml
- tapOn:
    id: new-recording
- extendedWaitUntil:
    visible:
      id: recording-end
    timeout: 20000
- takeScreenshot: recording
# Pas de « sleep » dans Maestro : on attend un élément qui n'apparaîtra pas.
- extendedWaitUntil:
    visible: 'e2e-never-visible'
    timeout: 4000
    optional: true
- tapOn:
    id: recording-end
- runFlow: subflows/follow-pipeline.yaml
