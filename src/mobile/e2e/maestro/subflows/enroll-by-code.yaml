# Enrôlement par code court (le QR n'est pas scannable sur simulateur).
appId: fr.gouv.mirai.audio-secure
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      microphone: allow
      notifications: allow
- takeScreenshot: 01-login
- tapOn:
    id: login-enter-code
- tapOn:
    id: code-input
- inputText: ${SIMPLE_CODE}
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: new-recording
    timeout: 20000
- takeScreenshot: 02-home
