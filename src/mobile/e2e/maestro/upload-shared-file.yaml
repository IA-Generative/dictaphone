# Enrôlement puis envoi d'un fichier « partagé » vers l'app et suivi du
# pipeline jusqu'au bout. N'utilise pas le micro : joué en CI.
appId: fr.gouv.mirai.audio-secure
name: Upload d'un fichier partagé
tags:
  - ci
env:
  SIMPLE_CODE: E2E123
---
- runScript:
    file: scripts/set-scenario.js
    env:
      SCENARIO: '{}'
- runFlow: subflows/enroll-by-code.yaml
- runFlow:
    file: subflows/share-file.yaml
    env:
      FILE: reunion-ok.m4a
- runFlow: subflows/follow-pipeline.yaml
