# Enrôlement puis envoi d'un fichier « partagé » vers l'app (lien e2e-ingest,
# builds E2E uniquement) et suivi du pipeline. N'utilise pas le micro :
# c'est le parcours joué en CI. Préparer le fichier avec e2e/prepare-fixture.sh.
appId: fr.gouv.mirai.audio-secure
name: Enrôlement et upload d'un fichier partagé
tags:
  - ci
env:
  SIMPLE_CODE: E2E123
---
- runFlow: subflows/enroll-by-code.yaml
- openLink: fr-gouv-assistant-transcripts://e2e-ingest?path=/tmp/mirai-e2e/reunion-e2e.m4a
# iOS peut demander confirmation avant d'ouvrir le lien.
- tapOn:
    text: "(Open|Ouvrir)"
    optional: true
- runFlow: subflows/follow-pipeline.yaml
